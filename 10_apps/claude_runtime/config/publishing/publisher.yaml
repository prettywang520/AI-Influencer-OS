version: "1.0"

# AIKO OS — Publisher Framework (Phase 10A)
#
# Local-only job preparation, validation, queueing, approval, scheduling
# and history for Instagram Feed / Stories / Reels and Threads. Nothing
# in this config drives any browser automation or live publish call —
# Phase 10A never opens Instagram/Threads.

default_persona_id: "aiko"

# IANA timezone used to interpret/validate --at ISO datetimes in the
# scheduler and to render config/publishing/schedule.yaml defaults.
timezone: "Asia/Tokyo"

# Whether a validated ("pending_approval") job requires an explicit human
# approval before it can be scheduled. Phase 10A always routes valid jobs
# through pending_approval regardless of this flag; it is read by the
# services as the documented policy switch for future phases.
approval_required: true

# Never write a queue/history/log file unless explicitly asked to.
dry_run_default: false

platform_limits:
  instagram_feed:
    caption_max_characters: 2200
  instagram_story:
    caption_max_characters: 2200
  instagram_reel:
    caption_max_characters: 2200
  threads_post:
    text_max_characters: 500

required_fields:
  instagram_feed:
    - media_paths
    - caption_text
  instagram_story:
    - media_paths
  instagram_reel:
    - media_paths
    - caption_text
  threads_post:
    - threads_text

allowed_media_extensions:
  - ".png"
  - ".jpg"
  - ".jpeg"
  - ".mp4"
  - ".mov"

paths:
  # All relative to the app root (10_apps/claude_runtime).
  queue_dir: "output/publishing/queues"
  queue_filename: "publish_queue.json"
  history_dir: "output/publishing/history"
  logs_dir: "output/publishing/logs"
  # Phase 10B — Instagram Feed Publisher (Preview Only). Diagnostic
  # screenshots only; never used to publish anything.
  screenshots_dir: "output/publishing/screenshots"
  # Phase 10C — Instagram Feed Manual Publish. One lock file per
  # in-flight/attempted send (see src/publishing/instagram_feed_sender.py
  # PublishLock); a lock is never deleted once Share has been clicked.
  locks_dir: "output/publishing/locks"

  # Per-production-date source layout read from Phase 9 output
  # (output/<date>/...). Do not invent files at these paths — the
  # publisher only builds a job when the resolved file actually exists.
  production_manifest_file: "production_manifest.json"
  content_plan_file: "content_plan.json"
  captions_dir: "captions"
  hashtags_dir: "hashtags"

  feed_caption_file: "captions/feed_caption.txt"
  feed_hashtags_file: "hashtags/feed_hashtags.txt"
  story_caption_template: "captions/story_{index}_caption.txt"
  reel_caption_file: "captions/reel_caption.txt"
  reel_hashtags_file: "hashtags/reel_hashtags.txt"
  threads_text_file: "captions/threads_post.txt"
  threads_hashtags_file: "hashtags/threads_hashtags.txt"

  # Phase 9 produces per-scene reel clips (videos/reel_scenes/shot_0N.mp4),
  # not one final Reel video. This is the conventional path a human/editor
  # drops the merged, final Reel video at; the Reel publish job is only
  # built when this exact file exists and is non-zero bytes.
  reel_final_video_file: "videos/reel_final.mp4"

# ---------------------------------------------------------------------------
# Phase 10C.5 — Publish Recovery & Audit
# ---------------------------------------------------------------------------
#
# src/publishing/publish_recovery.py is read-only (--inspect, --list-stuck)
# except for three explicit, --confirm-gated manual reconciliation actions
# (--mark-published, --mark-failed, --clear-stale-lock). It never opens
# Instagram and never clicks Share. All thresholds below are read from this
# file — nothing is hardcoded in Python.
recovery:
  # A job sitting in status="publishing" longer than this is surfaced by
  # --list-stuck (and status_service.py) as needing manual attention.
  publishing_stuck_after_minutes: 15

  # A publish lock must be at least this old, AND its pid must not be
  # confirmed active on the local machine, before --clear-stale-lock will
  # remove it. Recent locks and locks with a live owning process always
  # refuse, regardless of --confirm.
  lock_stale_after_minutes: 30

  # Relative to the app root (10_apps/claude_runtime).
  audit_dir: "output/publishing/audit"

  # Documents the policy every mutating recovery command already enforces
  # in code (--mark-published / --mark-failed / --clear-stale-lock all
  # require --confirm unconditionally); kept as an explicit, readable
  # config flag rather than an unwritten assumption.
  require_confirm_for_mutations: true

  # --mark-published refuses any platform_url that does not start with one
  # of these. Only real Instagram Feed post/reel URL prefixes belong here.
  allowed_instagram_url_patterns:
    - "https://www.instagram.com/p/"
    - "https://www.instagram.com/reel/"
