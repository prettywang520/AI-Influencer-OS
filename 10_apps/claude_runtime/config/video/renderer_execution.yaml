version: "1.0"

# AIKO OS — Renderer Execution Engine (Phase 11F)
#
# Orchestration-only settings. This module owns NO ffmpeg/ffprobe binary
# configuration -- that stays owned by config/video/engine.yaml
# (video_engine.py), config/media/inspector.yaml (media_inspector.py),
# and config/audio/music_mixer.yaml (music_mixer.py), loaded via each
# engine's own existing config loader. Phase 11F only ever calls real
# ffmpeg/ffprobe through those three already-tested engines -- it never
# constructs a raw ffmpeg command itself.
#
# --dry-run is the implicit default at the CLI layer (no --execute flag
# given); this file's dry_run_default only affects direct programmatic
# callers of execute_renderer_plan() that omit dry_run explicitly.

execution:
  schema_version: "1.0"
  dry_run_default: true
  allow_partial_execution_default: false
  # Filename suffix inserted before the extension of --output to name
  # the intermediate video-only file when a later pass (subtitle or
  # music) still needs to run after it (mirrors reel_builder.py/Phase
  # 11B.1's own intermediate/final naming convention).
  intermediate_filename_suffix: "_video_only"
  # Phase 11F.1 -- filename suffix for the intermediate file written
  # after a subtitle pass when a later pass (music) still follows it.
  # Unused (and therefore never written) for plans with no subtitle
  # pass, or where the subtitle pass is the last producing pass.
  subtitle_intermediate_filename_suffix: "_subtitled"
  log_filename_suffix: "_renderer_execution_log.json"

output:
  overwrite_requires_force: true
  atomic_write: true
