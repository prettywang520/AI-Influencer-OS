version: "1.0"

# AIKO OS — Overlay Plan Engine (Phase 11E)
#
# Adapter-only: converts a validated Timeline's subtitle/overlay tracks
# into one deterministic, validated overlay_plan.json for a future
# render pipeline. Uses only timeline_engine.py's existing public APIs.
# Never renders, never calls ffmpeg/ffprobe, never burns subtitles into
# video, never downloads fonts or assets, never modifies the source
# timeline.json.

plan:
  schema_version: "1.0"
  planning_version: "11E"
  fail_on_no_overlays: false
  include_disabled_default: false
  allow_custom_overlay_types: true
  validation_tolerance_seconds: 0.001
  # What an overlay with no resolvable type (no clip metadata hint, no
  # OverlayClip.overlay_type, not on a subtitle track) becomes.
  unresolved_overlay_type_fallback: custom

canvas:
  coordinate_space: pixel
  width_fallback: 1080
  height_fallback: 1920

safe_area:
  top: 160
  bottom: 320
  left: 80
  right: 80
  title_safe:
    top: 200
    bottom: 360
    left: 100
    right: 100
  action_safe:
    top: 220
    bottom: 420
    left: 120
    right: 120

overlay_types:
  subtitle:
    layer_order: 10
    default_z_index: 100
    safe_area_policy: error
    collision_group: primary_text

  cta:
    layer_order: 20
    default_z_index: 120
    safe_area_policy: error
    collision_group: primary_text

  location:
    layer_order: 30
    default_z_index: 110
    safe_area_policy: warning
    collision_group: secondary_text

  sticker:
    layer_order: 40
    default_z_index: 80
    safe_area_policy: warning
    collision_group: decorative

  logo:
    layer_order: 50
    default_z_index: 200
    safe_area_policy: warning
    collision_group: branding

  watermark:
    layer_order: 60
    default_z_index: 220
    safe_area_policy: warning
    collision_group: branding

  custom:
    layer_order: 100
    default_z_index: 50
    safe_area_policy: warning
    collision_group: custom

collision:
  enabled: true
  treat_unknown_bounds_as_warning: true
  fail_on_subtitle_cta_overlap: true
  fail_on_duplicate_overlay_id: true
  minimum_spacing_pixels: 16

position:
  allowed_anchors:
    - top_left
    - top_center
    - top_right
    - center_left
    - center
    - center_right
    - bottom_left
    - bottom_center
    - bottom_right
  default_anchor: bottom_center

validation:
  opacity_min: 0.0
  opacity_max: 1.0
  scale_min: 0.01
  scale_max: 10.0
  allow_negative_z_index: false

output:
  overwrite_requires_force: true
  atomic_write: true
