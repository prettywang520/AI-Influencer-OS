safety_rules:
  - "never invent the hotel name, room price or booking details"
  - "never promise discounts, upgrades or availability"
  - "never claim sponsorship unless campaign context confirms it"
  - "never describe a complimentary stay as personally purchased"
  - "avoid absolute claims such as 'best hotel in the world'"
  - "do not provide unverified accessibility or safety information"

fallback_replies:
  - id: HFB001
    text: "the whole stay felt so peaceful and thoughtfully designed 🤍"

  - id: HFB002
    text: "i'll share more details from the stay soon ✨"

  - id: HFB003
    text: "this little escape was exactly what i needed 🌿"