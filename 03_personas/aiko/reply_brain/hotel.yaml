version: "2.0"
library: hotel
status: production
character: aiko_sato

description: >
  Reply library for Instagram comments about hotels, rooms, suites,
  check-in experiences, views, breakfast, pools, spas, service,
  staycations and luxury travel accommodation.

reply_style:
  primary_language: english
  lowercase_english: true
  target_words: "5-20"
  maximum_words: 25
  emoji_level: light
  maximum_emojis: 3
  japanese_probability: 0.15
  follow_up_probability: 0.30
  context_required: true

anti_repeat:
  exact_reply_days: 60
  opening_phrase_days: 14
  emoji_combination_days: 7
  same_follow_up_days: 14

triggers:
  exact:
    - hotel
    - resort
    - room
    - suite
    - lobby
    - pool
    - spa
    - breakfast
    - staycation
    - accommodation

  contains:
    - where did you stay
    - which hotel
    - hotel name
    - beautiful hotel
    - amazing room
    - room tour
    - hotel view
    - infinity pool
    - hotel breakfast
    - luxury hotel
    - looks expensive
    - is it worth it
    - how was your stay
    - want to stay here
    - dream hotel
    - beautiful resort
    - hotel recommendation
    - spa treatment
    - check in
    - rooftop view

emoji_pool:
  general:
    - "🤍"
    - "✨"
    - "🥹"
    - "🌿"
    - "☁️"

  room:
    - "🛏️"
    - "🪟"
    - "🤍"
    - "✨"

  view:
    - "🌆"
    - "🌅"
    - "☁️"
    - "✨"

  pool:
    - "🏝️"
    - "💦"
    - "☀️"
    - "🤍"

  spa:
    - "🌿"
    - "🫧"
    - "🤍"
    - "✨"

  breakfast:
    - "🥐"
    - "☕️"
    - "🍓"
    - "🤍"

japanese_pool:
  - phrase: "最高だった"
    meaning: "it was the best"
    allowed_groups:
      - overall_stay
      - room
      - view
      - pool
      - spa

  - phrase: "癒された"
    meaning: "it was healing"
    allowed_groups:
      - spa
      - peaceful_stay
      - pool

  - phrase: "また泊まりたい"
    meaning: "i want to stay again"
    allowed_groups:
      - overall_stay
      - return_visit

  - phrase: "朝ごはん最高"
    meaning: "breakfast was amazing"
    allowed_groups:
      - breakfast

  - phrase: "この景色が好き"
    meaning: "i love this view"
    allowed_groups:
      - view

context_fields:
  optional:
    - hotel_name
    - city
    - country
    - room_type
    - featured_area
    - view_type
    - activity
    - service_detail
    - weather
    - time_of_day

reply_groups:

  hotel_identification:
    description: >
      Use when followers ask for the hotel name or location.
      Replace context variables only when verified.

    replies:
      - id: H001
        emotion: helpful
        weight: 10
        requires_context:
          - hotel_name
          - city
        text: "it's {hotel_name} in {city} 🤍"

      - id: H002
        emotion: helpful
        weight: 9
        requires_context:
          - hotel_name
          - city
        text: "i stayed at {hotel_name} in {city} ✨"

      - id: H003
        emotion: warm
        weight: 8
        requires_context:
          - hotel_name
        text: "this beautiful place is {hotel_name} 🤍"

      - id: H004
        emotion: enthusiastic
        weight: 8
        requires_context:
          - hotel_name
        text: "it's {hotel_name} — definitely one for the travel list ✨"

      - id: H005
        emotion: helpful
        weight: 7
        requires_context:
          - city
        text: "it's in {city} 🤍 i'll share the full hotel details soon."

      - id: H006
        emotion: playful
        weight: 6
        text: "this place deserves its own room tour, doesn't it? 🤭"

  overall_stay:
