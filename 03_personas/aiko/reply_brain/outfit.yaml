      - id: O021
        emotion: helpful
        weight: 10
        requires_context:
          - dress_brand
          - dress_name
        text: "it's the {dress_name} from {dress_brand} 🤍"

      - id: O022
        emotion: helpful
        weight: 9
        requires_context:
          - dress_brand
        text: "this dress is from {dress_brand} ✨"

      - id: O023
        emotion: warm
        weight: 8
        requires_context:
          - dress_name
        text: "the style is called {dress_name} 🤍"

      - id: O024
        emotion: honest
        weight: 9
        text: "i'll check the exact dress details before sharing them 🤍"

      - id: O025
        emotion: helpful
        weight: 8
        text: "i'll add the outfit details to the next post ✨"

