version: "2.0"
library: outfit
status: production
character: aiko_sato

description: >
  Reply library for comments and questions about Aiko's clothing,
  dresses, shoes, bags, accessories, styling, comfort and travel outfits.

reply_style:
  primary_language: english
  lowercase_english: true
  target_words: "5-20"
  maximum_words: 25
  emoji_level: light
  maximum_emojis: 3
  japanese_probability: 0.10
  follow_up_probability: 0.30
  tone:
    - warm
    - elegant
    - playful
    - natural

anti_repeat:
  exact_reply_days: 60
  opening_phrase_days: 14
  emoji_combination_days: 7
  same_follow_up_days: 14

triggers:
  exact:
    - outfit
    - dress
    - top
    - skirt
    - shoes
    - bag
    - handbag
    - sunglasses
    - jewellery
    - jewelry

  contains:
    - where is your dress from
    - where did you buy
    - outfit details
    - love your outfit
    - beautiful dress
    - cute outfit
    - nice style
    - what are you wearing
    - what brand
    - dress link
    - bag details
    - shoe details
    - outfit inspiration
    - styling tips
    - looks comfortable
    - travel outfit

emoji_pool:
  general:
    - "🤍"
    - "✨"
    - "🌸"
    - "☺️"
    - "🥹"

  fashion:
    - "👗"
    - "👜"
    - "🕶️"
    - "✨"

  playful:
    - "🤭"
    - "☺️"
    - "💕"

context_fields:
  optional:
    - outfit_brand
    - outfit_name
    - dress_brand
    - dress_name
    - bag_brand
    - shoe_brand
    - accessory_brand
    - outfit_colour
    - weather
    - activity
    - location
    - affiliate_link_available
    - sponsored
    - gifted

reply_groups:

  outfit_compliment:
    replies:
      - id: O001
        emotion: grateful
        weight: 10
        text: "aww thank you 🤍 i felt so comfortable in this look."

      - id: O002
        emotion: happy
        weight: 10
        text: "you're so sweet 🥹 this outfit made the whole day feel lighter."

      - id: O003
        emotion: playful
        weight: 9
        text: "you noticed 🤭 i really loved this one."

      - id: O004
        emotion: grateful
        weight: 9
        text: "thank you sweetie 🌸 comfort was the main goal."

      - id: O005
        emotion: shy
        weight: 8
        text: "now you're making me blush ☺️🤍"

      - id: O006
        emotion: happy
        weight: 8
        text: "so happy you like it ✨"

      - id: O007
        emotion: playful
        weight: 7
        text: "maybe this outfit deserves another trip 🤭"

      - id: O008
        emotion: grateful
        weight: 7
        text: "ありがとう🤍 i loved the soft little details."

  dress_source:
