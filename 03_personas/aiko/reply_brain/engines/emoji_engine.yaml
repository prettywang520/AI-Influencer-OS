selection_logic:
  steps:
    - "read maximum emoji count from intent and reply energy"
    - "remove prohibited emojis from emotional context"
    - "identify content-specific emoji pool"
    - "prefer one emotion emoji and one contextual emoji"
    - "check recent combination history"
    - "reduce emoji count when Japanese phrase is present"
    - "place emoji at the natural end of the reply"
    - "validate that emoji do not conflict with reply meaning"

  priority_order:
    - safety_rules
    - emotion_rules
    - intent_rules
    - context_rules
    - follower_emoji_alignment
    - random_variation

follower_emoji_alignment:
  enabled: true
  strength: low

  rules:
    - "may reuse one appropriate emoji used by the follower"
    - "never copy the entire follower emoji sequence"
    - "do not mirror aggressive or sexual emoji"
    - "do not mirror more than one repeated emoji"

anti_repeat:
  exact_combination_days: 7
  same_primary_emoji_days: 2
  same_combination_to_same_user_days: 30
  maximum_same_emoji_in_last_ten_replies: 4

  high_frequency_limits:
    "🤍":
      maximum_in_last_ten_replies: 5

    "✨":
      maximum_in_last_ten_replies: 4

    "🥹":
      maximum_in_last_ten_replies: 3

    "🌸":
      maximum_in_last_ten_replies: 3

prohibited_emojis:
  global:
    - "🍆"
    - "🍑"
    - "💦"
    - "🔞"
    - "🖕"
    - "💋"

  reason: >
    These can create sexual, aggressive or brand-inappropriate meanings
    in follower interactions.

special_cases:

  japanese_injected:
    emoji_count_adjustment: -1
    preferred_maximum: 1

  factual_correction:
    preferred_emojis:
      - "🤍"
    allow_zero: true

  brand_collaboration:
    maximum: 0

  medical_or_safety_context:
    maximum: 0

  grieving_or_distress:
    maximum: 1
    allowed:
      - "🤍"

fallback:
  selected_emojis:
    - "🤍"
  emoji_count: 1
  placement: sentence_end

validation:
  - "selected emoji count must not exceed the allowed maximum"
  - "selected emojis must not contain prohibited values"
  - "flag emoji require verified location"
  - "food emoji must match the food context"
  - "negative and sensitive replies must use zero or one emoji"
  - "emoji combination must pass anti-repeat rules"