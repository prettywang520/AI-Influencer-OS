version: "1.0"
engine: emoji_engine
status: production
character: aiko_sato

description: >
  Selects natural emoji combinations for Aiko's Instagram replies.
  Emoji must support the message tone and context without making replies
  look automated, childish or repetitive.

objectives:
  - match emoji to intent, emotion and content context
  - keep emoji usage light and natural
  - avoid repeating identical combinations
  - prevent inappropriate emoji in negative or sensitive conversations
  - preserve Aiko's gentle luxury-travel personality

input:
  required:
    - primary_intent
    - detected_emotion
    - reply_energy
    - reply_text

  optional:
    - selected_library
    - reply_group
    - post_topic
    - post_location
    - post_activity
    - current_weather
    - current_time_of_day
    - previous_emoji_history
    - follower_emoji
    - moderation_status
    - japanese_injected

output:
  required:
    - emoji_count
    - selected_emojis
    - placement

  optional:
    - selected_combination_id
    - rejected_emojis
    - rejection_reason

global_rules:
  minimum_emojis: 0
  normal_maximum_emojis: 3
  preferred_emojis: "1-2"
  maximum_repeated_same_emoji: 1

  rules:
    - "emoji must support the meaning of the reply"
    - "do not add emoji to every reply"
    - "use zero emojis when the conversation is serious"
    - "never use more than three emojis"
    - "avoid placing emoji after every sentence"
    - "prefer one coherent combination over unrelated emoji"
    - "never use flags unless the country is verified"
    - "do not use food emoji unless the conversation is about food"
    - "do not use romantic emoji for ordinary compliments"
    - "avoid emoji that change the meaning of a sentence"
    - "do not mirror excessive follower emoji use"
    - "Japanese phrases count as part of the expressive layer and may reduce emoji count"

count_rules:

  by_reply_energy:
    very_low:
      minimum: 0
      maximum: 1
      preferred: 0

    low:
      minimum: 0
      maximum: 2
      preferred: 1

    medium:
      minimum: 1
      maximum: 2
      preferred: 1

    high:
      minimum: 1
      maximum: 3
      preferred: 2

  by_intent:
    spam:
      maximum: 0

    harassment:
      maximum: 0

    safety_threat:
      maximum: 0

    negative_feedback:
      maximum: 1

    factual_correction:
      maximum: 1

    brand_collaboration:
      maximum: 0

    flirtation:
      maximum: 2

    compliment:
      maximum: 2

    engagement:
      maximum: 2

    greeting:
      maximum: 2

    emoji_only:
      maximum: 1

placement_rules:
  default: sentence_end

  allowed:
    - sentence_end
    - phrase_end
    - between_short_clauses

  prohibited:
    - sentence_start_for_serious_reply
    - between_words
    - after_every_sentence
    - inside_venue_name
    - inside_brand_name
    - inside_japanese_phrase

  examples:
    good:
      - "aww you're so sweet 🤍"
      - "i'd love to visit one day 🌸"
      - "coffee or matcha? ☕️🍵"

    bad:
      - "🤍 aww you're 🤍 so sweet 🤍"
      - "this 📷 was taken 📷 in tokyo"
      - "Ginza✨ Mitsukoshi"

