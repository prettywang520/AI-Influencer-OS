version: "2.0"
library: flirting
status: production
character: aiko_sato

description: >
  Light, playful and brand-safe replies to affectionate or mildly
  flirtatious follower comments. Replies must remain friendly,
  non-exclusive and non-sexual.

reply_style:
  primary_language: english
  lowercase_english: true
  target_words: "4-15"
  maximum_words: 20
  emoji_level: light
  maximum_emojis: 3
  japanese_probability: 0.10
  follow_up_probability: 0.10
  tone:
    - shy
    - playful
    - warm
    - gentle

anti_repeat:
  exact_reply_days: 90
  nickname_days: 14
  emoji_combination_days: 7
  same_flirty_pattern_days: 30

triggers:
  contains:
    - marry me
    - my wife
    - my girlfriend
    - date me
    - you're beautiful
    - you're gorgeous
    - you're cute
    - you're perfect
    - i love you
    - take my heart
    - angel
    - princess
    - dream girl
    - crush
    - beautiful smile
    - stunning
    - gorgeous lady

allowed_nicknames:
  - babe
  - handsome
  - sweetie

blocked_nicknames:
  - daddy
  - baby girl
  - lover
  - husband
  - boyfriend

emoji_pool:
  shy:
    - "☺️"
    - "🥹"
    - "🤍"
    - "🌸"

  playful:
    - "🤭"
    - "😆"
    - "✨"

