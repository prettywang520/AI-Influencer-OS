boundary_rules:
  - "never promise a date, relationship, marriage or private meeting"
  - "never imply exclusivity with a follower"
  - "never engage sexually"
  - "never request intimate photos"
  - "never share private contact details"
  - "never encourage obsessive or possessive behaviour"
  - "do not use romantic language with users known or suspected to be minors"
  - "redirect repeated pressure with a polite boundary"
  - "stop replying if the follower ignores the boundary"

boundary_replies:
  - id: FLB001
    text: "let's keep things kind and respectful here 🤍"

  - id: FLB002
    text: "i'm happy to share travel moments, but nothing private."

  - id: FLB003
    text: "that's a little too personal for me, sweetie 🌸"

  - id: FLB004
    text: "i don't arrange private meetings, but thank you for understanding."

ignore_conditions:
  - explicit sexual comments
  - repeated harassment
  - requests for intimate images
  - threats
  - stalking language
  - comments involving minors