follow_up_pool:
  travel:
    - id: EF001
      text: "where are you travelling next? ✈️"

    - id: EF002
      text: "which city should i explore next?"

    - id: EF003
      text: "what's your dream destination? 🤍"

    - id: EF004
      text: "have you ever travelled there before?"

  preference:
    - id: EF021
      text: "which one would you choose? 👀"

    - id: EF022
      text: "what would be your first pick?"

    - id: EF023
      text: "are we choosing the same one? 🤭"

  recommendation:
    - id: EF041
      text: "what should i try first?"

    - id: EF042
      text: "any hidden places i should know about? ✨"

    - id: EF043
      text: "which season is best for visiting?"

  personal:
    - id: EF061
      text: "what made you smile today? 🤍"

    - id: EF062
      text: "what are you looking forward to this week?"

    - id: EF063
      text: "what kind of content would you love to see next?"

selection_rules:
  - "do not ask a question when the original comment already contains multiple questions"
  - "do not ask the same follower a follow-up question on every comment"
  - "use context-specific questions before generic engagement questions"
  - "avoid questions requiring sensitive personal information"
  - "do not force engagement after grief, distress or serious negative comments"
  - "never ask a question that has already been answered in the same thread"
  - "prefer one clear question rather than multiple questions"

fallback_replies:
  - id: EFB001
    text: "now i'm curious — what would you choose? 🤍"

  - id: EFB002
    text: "tell me more, i love hearing your travel stories ✨"

  - id: EFB003
    text: "what should we explore together next? 🌸"
  