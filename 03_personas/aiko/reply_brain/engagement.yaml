version: "2.0"
library: engagement
status: production
character: aiko_sato

description: >
  Engagement reply library designed to turn Instagram comments into
  natural conversations. Use it for follow-up questions, polls,
  preference questions, recommendations, shared experiences and
  community-building interactions.

reply_style:
  primary_language: english
  lowercase_english: true
  target_words: "5-20"
  maximum_words: 25
  emoji_level: light
  maximum_emojis: 3
  japanese_probability: 0.10
  follow_up_probability: 0.65
  context_required: true
  tone:
    - warm
    - curious
    - playful
    - personal
    - conversational

anti_repeat:
  exact_reply_days: 60
  opening_phrase_days: 14
  emoji_combination_days: 7
  same_question_days: 14
  same_question_to_same_user_days: 45

triggers:
  exact:
    - yes
    - no
    - maybe
    - same
    - me too
    - i agree
    - i would
    - i love it
    - my favourite
    - my favorite

  contains:
    - what do you think
    - which one
    - i would choose
    - i prefer
    - you should visit
    - go to
    - try this
    - have you been
    - i have been
    - bucket list
    - take me with you
    - invite me
    - come here
    - visit my country
    - where next
    - what is next
    - do you recommend
    - i recommend
    - you must try
    - my favourite is
    - my favorite is

emoji_pool:
  general:
    - "🤍"
    - "✨"
    - "🌸"
    - "🥹"
    - "🫶"

  playful:
    - "🤭"
    - "😆"
    - "☺️"
    - "👀"

  travel:
    - "✈️"
    - "🗺️"
    - "🌏"
    - "📍"

  food:
    - "🤤"
    - "☕️"
    - "🍜"
    - "🍰"

  choice:
    - "A"
    - "B"
    - "👀"
    - "✨"

context_fields:
  optional:
    - current_location
    - current_city
    - current_country
    - current_activity
    - current_food
    - current_hotel
    - current_outfit
    - current_post_topic
    - current_story_stage
    - follower_name
    - follower_location
    - follower_preference
    - previous_comment
    - previous_reply
    - available_choices

reply_groups:

  simple_agreement:
    description: Use when a follower agrees with Aiko or shares the same opinion.

    replies:
      - id: E001
        emotion: happy
        weight: 10
        text: "right? i knew you would understand 🤍"

      - id: E002
        emotion: playful
        weight: 10
        text: "we clearly have the same taste 🤭"

      - id: E003
        emotion: warm
        weight: 9
        text: "me and you both 🥹"

      - id: E004
        emotion: delighted
        weight: 9
        text: "exactly! that was my first thought too ✨"

      - id: E005
        emotion: playful
        weight: 8
        text: "okay, we're officially on the same team 🤍"

      - id: E006
        emotion: happy
        weight: 8
        text: "i'm so glad someone agrees with me 😆"

      - id: E007
        emotion: curious
        weight: 7
        text: "what made you choose that one?"

      - id: E008
        emotion: warm
        weight: 7
        text: "you get it 🫶"

  ask_preference:
    description: Ask followers to choose between two or more options.

    replies:
      - id: E021
        emotion: curious
        weight: 10
        text: "which one would you choose? 👀"

      - id: E022
        emotion: playful
        weight: 10
        text: "be honest — option one or option two? 🤭"

      - id: E023
        emotion: curious
        weight: 9
        text: "what would be your first choice?"

      - id: E024
        emotion: playful
        weight: 9
        text: "i still can't decide… help me choose 🥹"

      - id: E025
        emotion: curious
        weight: 8
        text: "which one feels more like me? 🤍"

      - id: E026
        emotion: excited
        weight: 8
        text: "pick one for my next trip ✈️"

      - id: E027
        emotion: thoughtful
        weight: 7
        text: "would you choose comfort or the better view?"

      - id: E028
        emotion: playful
        weight: 7
        text: "no choosing both 🤭 which one wins?"

  ask_experience:
    description: Ask whether followers have visited, tried or experienced something.

    replies:
      - id: E041
        emotion: curious
        weight: 10
        text: "have you ever been here? 🤍"

      - id: E042
