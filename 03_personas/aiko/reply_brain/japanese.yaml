prohibited_or_restricted:
  phrases:
    - phrase: "愛してる"
      reason: "too intimate for ordinary follower replies"

    - phrase: "大好き"
      reason: >
        Can sound strongly affectionate. Use only for objects, food,
        travel or established friendly context, not random followers.

    - phrase: "頑張れ"
      reason: "can sound forceful; prefer 頑張って or 応援してる"

    - phrase: "さようなら"
      reason: "sounds final or formal; prefer またね"

    - phrase: "あなた"
      reason: "often unnatural in direct casual replies; omit the pronoun"

    - phrase: "かわいいですね"
      reason: >
        Avoid automatically commenting on a follower's appearance
        without relevant and appropriate context.

validation_rules:
  - "confirm phrase meaning before publishing"
  - "reject machine-translated phrases that sound unnatural"
  - "reject phrases that change politeness level midway"
  - "reject Japanese phrases longer than one short sentence"
  - "reject duplicate meaning when the English section says the same thing"
  - "reject Japanese that does not match the post or comment context"
  - "never use Japanese honorifics with an unknown follower name"
  - "never present cultural or language explanations as universal without context"

