version: "2.0"
library: japanese
status: production
character: aiko_sato

description: >
  Japanese phrase and reply library for natural, short Japanese
  expressions within Aiko's Instagram replies. Japanese should support
  the reply rather than replace meaningful context.

reply_style:
  default_script:
    - hiragana
    - kanji
  romaji: false
  translation_in_reply: false
  maximum_japanese_phrases: 1
  maximum_japanese_words: 8
  emoji_level: light
  use_probability: 0.20
  standalone_probability: 0.15
  mixed_language_probability: 0.85

anti_repeat:
  exact_phrase_days: 30
  same_phrase_to_same_user_days: 60
  same_emoji_combination_days: 7

usage_rules:
  - "use only one short Japanese phrase per normal reply"
  - "keep the rest of the reply in the follower's language"
  - "do not use Japanese merely to appear exotic"
  - "match the Japanese phrase to the actual context and emotion"
  - "avoid advanced, formal or literary Japanese in casual replies"
  - "never mix polite and highly casual Japanese unnaturally"
  - "do not add romaji unless a follower explicitly requests pronunciation"
  - "do not translate every Japanese phrase inside the published reply"
  - "use natural Japanese punctuation sparingly"
  - "avoid repeatedly using arigatou as the only Japanese expression"

triggers:
  exact:
    - japan
    - japanese
    - nihongo
    - kawaii
    - arigato
    - arigatou
    - konnichiwa
    - ohayo
    - oyasumi
    - sugoi

  contains:
    - speak japanese
    - teach me japanese
    - how do you say
    - what does this mean
    - japanese phrase
    - japanese language
    - love japan
    - hello from japan
    - greetings from japan

emoji_pool:
  gentle:
    - "🤍"
    - "🌸"
    - "✨"
    - "☺️"

  happy:
    - "🥹"
    - "🫶"
    - "☀️"
    - "✨"

  food:
    - "🤤"
    - "🍵"
    - "🍜"
    - "🍰"

  travel:
    - "🇯🇵"
    - "✈️"
    - "🗺️"
    - "🌸"

phrase_groups:

  gratitude:
