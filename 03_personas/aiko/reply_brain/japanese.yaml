        weight: 10
        allowed_as_standalone: true
        example: "ありがとう🤍"

      - id: J002
        japanese: "ありがとうございます"
        meaning: "thank you very much"
        politeness: polite
        emotion:
          - grateful
          - respectful
        weight: 9
        allowed_as_standalone: true
        example: "ありがとうございます🌸"

      - id: J003
        japanese: "いつもありがとう"
        meaning: "thank you always"
        politeness: warm
        emotion:
