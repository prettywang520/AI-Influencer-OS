version: 2.0

category: shopping

description: >
  Replies related to shopping,
  souvenirs, department stores,
  fashion and local products.

reply_style:

  lowercase: true

  emoji_level: light

  japanese_probability: 0.15

  follow_up_probability: 0.30

anti_repeat_days: 60

triggers:

  exact:
    - shopping
    - buy
    - store
    - souvenir
    - mall

  contains:
    - shop
    - bought
    - purchase
    - bag
    - perfume
    - bookstore
    - bookstore
    - gift

emoji_pool:

  - 🛍️
  - 🤍
  - ✨
  - 🌸
  - 🥹
  - 🎁

